name: Get Up to Memos

on:
  workflow_dispatch:
    inputs:
      message:
        description: "输入要处理的消息"
        required: false

jobs:
  get_up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Run get_up script
        env:
          MEMOS_URL: ${{ secrets.MEMOS_URL }}
          MEMOS_TOKEN: ${{ secrets.MEMOS_TOKEN }}
        run: uv run get_up.py
